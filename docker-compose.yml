version: '3.8'

services:
  opencode-go-usage:
    build: .
    container_name: opencode-go-usage
    restart: unless-stopped
    ports:
      - "8788:8788"
    volumes:
      - opencode-go-usage-data:/app/data
      # Optional: mount a config file for automatic account import on first run
      # - ./config.json:/app/config.json
    environment:
      - 68BACKEND_DATA=/app/data
      - 68BACKEND_LISTEN_HOST=0.0.0.0
      - 68BACKEND_LISTEN_PORT=8788

volumes:
  opencode-go-usage-data:
